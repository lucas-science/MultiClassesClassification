[project]
name = "iav"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.4",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
cuda = [
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "extra != 'cuda'" },
    { index = "pytorch-cu132", marker = "extra == 'cuda'" },
]

torchvision = [
    { index = "pytorch-cpu", marker = "extra != 'cuda'" },
    { index = "pytorch-cu132", marker = "extra == 'cuda'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
