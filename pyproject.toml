[project]
name = "iav"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.3",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[project.optional-dependencies]
cuda = [
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", extra = "cuda" },
]

torchvision = [
    { index = "pytorch-cu132", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true